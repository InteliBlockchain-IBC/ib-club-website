name: Publicar imagem no GHCR

on:
  push:
    branches: [main]
    # mudança só em documentação não precisa reconstruir imagem
    paths-ignore: ['**.md', 'design-concepts/**']
  workflow_dispatch:

concurrency:
  group: imagem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # a organização tem maiúsculas no nome e o GHCR só aceita minúsculas;
      # esta action normaliza isso sozinha
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # constrói e CARREGA no daemon local, sem publicar ainda: uma imagem
      # que não sobe não pode chegar ao Easypanel
      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ib-club-website:teste
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Provar que a imagem sobe e serve a página
        run: |
          docker run -d --name teste -p 3000:3000 ib-club-website:teste
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          pagina=$(curl -fsS http://localhost:3000/) || { docker logs teste; exit 1; }
          echo "$pagina" | grep -q '<div id="root">' || { echo 'index.html sem #root'; docker logs teste; exit 1; }
          # o HTML pode responder 200 e os assets estarem fora do lugar
          js=$(echo "$pagina" | grep -o '/src\.[a-z0-9]*\.js')
          [ -n "$js" ] || { echo 'nenhum bundle referenciado no HTML'; exit 1; }
          curl -fsS "http://localhost:3000$js" > /dev/null || { echo "bundle $js não é servido"; exit 1; }
          echo "ok: página e bundle $js respondendo"
          docker rm -f teste

      # cache quente da etapa anterior: esta é praticamente instantânea
      - name: Publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Avisar o Easypanel
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "EASYPANEL_WEBHOOK não configurado — imagem publicada, sem redeploy automático."
            echo "Ver DEPLOY.md §3 para criar o webhook."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK" && echo "Easypanel avisado."
